name: CD

on:
  release:
    types: [published]

jobs:
  npm:
    name: publish to npm
    if: github.repository == 'charles-turner-1/xarray-ts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC: npm trusted publishing with provenance

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Update npm
        run: npm install -g npm@latest

      - name: Resolve release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          if [ "$VERSION" = "$RELEASE_TAG" ]; then
            echo "::error::Release tag must start with v, for example v0.1.2."
            exit 1
          fi

          if ! node -e 'const v = process.argv[1]; const re = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/; if (!re.test(v)) process.exit(1);' "$VERSION"; then
            echo "::error::Release tag ${RELEASE_TAG} is not a valid npm version."
            exit 1
          fi

          if npm view "xarray-ts@$VERSION" version >/dev/null 2>&1; then
            echo "::error::xarray-ts@$VERSION is already published to npm."
            exit 1
          fi

          DIST_TAG="latest"
          if [ "$IS_PRERELEASE" = "true" ]; then
            DIST_TAG="next"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Update package version
        run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Check package surface
        run: npm run check:package

      - name: Build distributions
        run: npm run build

      - name: Verify packed package
        run: npm pack --dry-run

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "package.json and package-lock.json already match v${{ steps.release.outputs.version }}."
          else
            git commit -m "chore: release v${{ steps.release.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish package to npm
        run: npm publish --access public --provenance --tag "${{ steps.release.outputs.dist_tag }}"
